<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/bybot-logo-light.png" />
    <title>ByBot · ByB Jurídicos</title>
    <script>
      // Aplica el tema antes del primer render para evitar parpadeo.
      try {
        var stored = localStorage.getItem('bybot-theme') || localStorage.getItem('node2-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) { /* sin almacenamiento */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
